services:
  vinculo-vial-ia:
    container_name: vinculo-vial-ia
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Dentro del contenedor los pesos siempre están en /models; MODELS_DIR del .env es la ruta del host.
      MODELS_DIR: /models
    volumes:
      - ${MODELS_DIR:-./models/weights}:/models:ro
    read_only: true
    restart: unless-stopped
    networks:
      - vinculo-vial
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

networks:
  vinculo-vial:
    external: true
